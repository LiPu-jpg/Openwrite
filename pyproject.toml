[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "openwrite"
version = "5.8.0"
description = "OpenWrite 长篇小说创作引擎 — AI 辅助小说创作"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0,<3.0",
    "pyyaml>=6.0",
    "openai>=1.0",
    "anthropic>=0.18",
    "litellm>=1.82.6,<1.83",
    "httpx[socks]>=0.27,<1.0",
    "markdown-it-py>=3.0",
    "prompt_toolkit>=3.0",
    "lightrag-hku>=1.5.5,<2.0",
    "fastembed>=0.7.0,<1.0",
    "tomli>=2.0; python_version < '3.11'",
]

[tool.setuptools.packages.find]
include = ["tools*", "models*", "craft*", "integrations*"]
exclude = ["tests*", "data*", "skills*", "config*", "docs*"]

[tool.setuptools.package-data]
tools = [
    "studio_assets/*",
    "studio_assets/js/*",
    "studio_assets/vendor/vditor/*",
    "studio_assets/vendor/vditor/dist/*",
    "studio_assets/vendor/vditor/dist/css/content-theme/*",
    "studio_assets/vendor/vditor/dist/js/i18n/*",
    "studio_assets/vendor/vditor/dist/js/icons/*",
    "studio_assets/vendor/vditor/dist/js/lute/*",
    "runtime_skills/*/manifest.yaml",
    "runtime_skills/*/*.md",
    "runtime_skills/*/agents/*",
    "runtime_skills/*/LICENSE",
    "runtime_skills/*/references/*",
]
craft = ["*.md", "*.yaml", "*.yml"]
integrations = ["deepresearch/**"]

[tool.setuptools.exclude-package-data]
integrations = [
    "deepresearch/node_modules/**",
    "deepresearch/dist/**",
    "deepresearch/**/node_modules/**",
    "deepresearch/**/dist/**",
    "deepresearch/artifacts/**",
    "deepresearch/**/artifacts/**",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "mypy>=1.10",
    "ruff>=0.5",
]

[project.scripts]
openwrite = "tools.cli:main"
openwrite-launcher = "tools.desktop_launcher:main"

[tool.setuptools.data-files]
"share/openwrite" = ["启动 OpenWrite.command", "启动 OpenWrite.bat"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
exclude = [
    "reference/",
    "__pycache__/",
    "data/",
]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_functions = "test_*"
