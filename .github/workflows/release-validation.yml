name: Release artifact validation
on:
  push:
    branches: [main, 'codex/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm install --global pnpm@9.15.9
      - run: node scripts/prepare.mjs
      - run: npm --prefix vendor/dsh-dog run typecheck
      - run: npm run doctor
      - run: npm run test:managed
      - run: node --test scripts/preset-lifecycle.test.mjs scripts/maintenance.test.mjs
      - run: npm run test:components
      - run: npm --prefix vendor/dsh-dog test
      - run: node scripts/release-provenance.mjs
      - run: npm pack --ignore-scripts
      - run: node scripts/release-check.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: release-package
          path: |
            dsh-openwrite-*.tgz
            dsh-openwrite-*.tgz.manifest.json
          if-no-files-found: error
  install:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node: '24'
          - os: macos-15
            node: '24'
          - os: macos-15-intel
            node: '24'
          - os: windows-latest
            node: '24'
          - os: ubuntu-latest
            node: '22.19.0'
          - os: ubuntu-latest
            node: '26'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm install --global pnpm@9.15.9
      - run: npm ci --prefix packages/studio-panel --ignore-scripts --no-audit --no-fund
      - if: runner.os != 'Windows'
        run: node packages/studio-panel/node_modules/playwright/cli.js install --with-deps chromium
      - if: runner.os == 'Windows'
        run: node packages/studio-panel/node_modules/playwright/cli.js install chromium
      - uses: actions/download-artifact@v4
        with:
          name: release-package
      - run: node scripts/release-check.mjs
      - run: node scripts/release-smoke.mjs --browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: acceptance-${{ matrix.os }}-node-${{ matrix.node }}
          path: |
            release-report-*.json
            release-browser-*.png
          if-no-files-found: warn
  source-install:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm install --global pnpm@9.15.9
      - run: node scripts/release-smoke.mjs github:LiPu-jpg/Openwrite#${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: acceptance-github-source
          path: release-report-source-*.json
          if-no-files-found: warn
  acceptance:
    needs: [build, install, source-install]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/download-artifact@v4
        with:
          path: .tmp-release-final
          merge-multiple: true
      - run: node scripts/release-report.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: validated-release
          path: .tmp-release-final/*
          include-hidden-files: true
          if-no-files-found: error
