name: Release artifact validation
on:
  push:
    branches: [main]
    paths-ignore:
      - 'README.md'
      - 'docs/**/*.md'
  pull_request:
    paths-ignore:
      - 'README.md'
      - 'docs/**/*.md'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm install --global pnpm@9.15.9
      - run: node scripts/prepare.mjs
      - run: npm --prefix vendor/dsh-dog run typecheck
      - run: npm run doctor
      - run: npm run test:managed
      - run: node --test scripts/preset-lifecycle.test.mjs scripts/maintenance.test.mjs
      - run: npm run test:components
      - run: npm --prefix vendor/dsh-dog test
      - run: node scripts/release-provenance.mjs
      - run: npm pack --ignore-scripts
      - run: node scripts/release-check.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: release-package
          path: |
            dsh-openwrite-*.tgz
            dsh-openwrite-*.tgz.manifest.json
          if-no-files-found: error
  client-contracts:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - host: '0.1.2-rc.1'
            before: '2026-09-09T00:00:00Z'
          - host: '0.1.5-alpha.1'
            before: '2026-09-09T00:00:00Z'
          - host: '0.2.0-rc.2'
            before: '2026-10-03T00:00:00Z'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm ci --prefix packages/studio-panel --ignore-scripts --no-audit --no-fund
      - if: runner.os == 'Linux'
        # GitHub-hosted ubuntu runners occasionally get a runner whose Azure
        # apt mirror is dead; apt then hangs single-threaded until the job
        # timeout kills the whole matrix leg. Pin the mirror list to the
        # public archive and bound every connection so a sick runner fails
        # (and can be retried) in seconds instead of wedging for 25 minutes.
        run: |
          echo 'http://archive.ubuntu.com/ubuntu/' | sudo tee /etc/apt/apt-mirrors.txt
          printf 'Acquire::Retries "5";\nAcquire::http::Timeout "30";\nAcquire::https::Timeout "30";\n' | sudo tee /etc/apt/apt.conf.d/99-ci-mirror-guard
      - run: node packages/studio-panel/node_modules/playwright/cli.js install --with-deps chromium
      - uses: actions/download-artifact@v4
        with:
          name: release-package
      - run: npm install --prefix .tmp-client-host @deepseek-ai/dsh@${{ matrix.host }} --before=${{ matrix.before }} --registry=https://registry.npmjs.org --ignore-scripts --no-audit --no-fund
      - run: node scripts/preset-smoke.mjs --host-cli=.tmp-client-host/node_modules/@deepseek-ai/dsh/lib/bin.js
      - run: node scripts/client-boot-smoke.mjs dsh-openwrite-*.tgz --host-cli=.tmp-client-host/node_modules/@deepseek-ai/dsh/lib/bin.js --report=client-report-${{ matrix.host }}.json
      - uses: actions/upload-artifact@v4
        with:
          name: acceptance-client-${{ matrix.host }}
          path: client-report-*.json
          if-no-files-found: error
  install:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node: '24'
          - os: macos-15
            node: '24'
          - os: macos-15-intel
            node: '24'
          - os: windows-latest
            node: '24'
          - os: ubuntu-latest
            node: '22.19.0'
          - os: ubuntu-latest
            node: '26'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm install --global pnpm@9.15.9
      - run: npm ci --prefix packages/studio-panel --ignore-scripts --no-audit --no-fund
      - if: runner.os == 'Linux'
        # See client-contracts: guard apt against dead Azure mirrors.
        run: |
          echo 'http://archive.ubuntu.com/ubuntu/' | sudo tee /etc/apt/apt-mirrors.txt
          printf 'Acquire::Retries "5";\nAcquire::http::Timeout "30";\nAcquire::https::Timeout "30";\n' | sudo tee /etc/apt/apt.conf.d/99-ci-mirror-guard
      - if: runner.os != 'Windows'
        run: node packages/studio-panel/node_modules/playwright/cli.js install --with-deps chromium
      - if: runner.os == 'Windows'
        run: node packages/studio-panel/node_modules/playwright/cli.js install chromium
      - uses: actions/download-artifact@v4
        with:
          name: release-package
      - run: node scripts/release-check.mjs
      - run: node packages/studio-panel/scripts/packaged-globals-browser.mjs
      - run: node scripts/release-smoke.mjs --browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: acceptance-${{ matrix.os }}-node-${{ matrix.node }}
          path: |
            release-report-*.json
            release-browser-*.png
          if-no-files-found: warn
  source-install:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm install --global pnpm@9.15.9
      - run: node scripts/release-smoke.mjs github:LiPu-jpg/Openwrite#${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: acceptance-github-source
          path: release-report-source-*.json
          if-no-files-found: warn
  compatibility-alpha:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm install --global pnpm@9.15.9
      # Freeze the published alpha.1 dependency graph: a later partial alpha.2
      # publication currently breaks unconstrained upstream npm installation.
      - run: npm install --prefix .tmp-dsh-alpha @deepseek-ai/dsh@0.1.5-alpha.1 --before=2026-09-09T00:00:00Z --registry=https://registry.npmjs.org --no-audit --no-fund
      - run: node scripts/preset-smoke.mjs --host-cli=.tmp-dsh-alpha/node_modules/@deepseek-ai/dsh/lib/bin.js
      - run: npm ci --prefix packages/studio-panel --ignore-scripts --no-audit --no-fund
      - if: runner.os == 'Linux'
        # See client-contracts: guard apt against dead Azure mirrors.
        run: |
          echo 'http://archive.ubuntu.com/ubuntu/' | sudo tee /etc/apt/apt-mirrors.txt
          printf 'Acquire::Retries "5";\nAcquire::http::Timeout "30";\nAcquire::https::Timeout "30";\n' | sudo tee /etc/apt/apt.conf.d/99-ci-mirror-guard
      - run: node packages/studio-panel/node_modules/playwright/cli.js install --with-deps chromium
      - uses: actions/download-artifact@v4
        with:
          name: release-package
      - run: node scripts/release-smoke.mjs --host-cli=.tmp-dsh-alpha/node_modules/@deepseek-ai/dsh/lib/bin.js --browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: acceptance-dsh-alpha
          path: |
            release-report-0.1.5-alpha.1-*.json
            release-browser-*.png
            .tmp-dsh-alpha/package-lock.json
          include-hidden-files: true
          if-no-files-found: warn
  acceptance:
    needs: [build, install, source-install, compatibility-alpha, client-contracts]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/download-artifact@v4
        with:
          path: .tmp-release-final
          merge-multiple: true
      - run: node scripts/release-report.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: validated-release
          path: .tmp-release-final/*
          include-hidden-files: true
          if-no-files-found: error
