name: Plugin maintenance
on:
  push:
    branches: [main, native-core]
    paths-ignore:
      - 'README.md'
      - 'docs/**/*.md'
  # No paths-ignore here: this workflow is the only consumer of
  # `npm run docs:check`, which is what catches a doc that names a tool that no
  # longer exists. Ignoring docs-only PRs made that gate unreachable.
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: plugin-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  offline-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            packages/openwrite-bridge/package-lock.json
            packages/studio-panel/package-lock.json
      - uses: ./.github/actions/ci-setup
      - run: npm install --global pnpm@9.15.9
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm ci --prefix packages/openwrite-bridge --no-audit --no-fund
      - run: npm ci --prefix packages/studio-panel --no-audit --no-fund
      - run: npm run check:plugin
