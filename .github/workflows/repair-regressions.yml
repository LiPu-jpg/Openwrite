name: Repair regression verification
on:
  push:
    branches: [main]
    paths-ignore:
      - 'README.md'
      - 'docs/**/*.md'
  pull_request:
    paths-ignore:
      - 'README.md'
      - 'docs/**/*.md'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: repairs-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  core-regressions:
    env:
      PYTHONUTF8: '1'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          path: plugin
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: plugin/package-lock.json
      # The pinned commit comes from the PR's own manifest, so a fork PR could
      # point it elsewhere and have this workflow execute that commit's tests.
      # The wheel's own source bytes are still verified against whatever is
      # checked out (the next step), and `verify-core-wheel-source.py` fails when
      # they differ — but scope the checkout to the base ref's manifest so the
      # claim of an "immutable Git source" is not only as trustworthy as the PR.
      - name: Read the wheel's immutable Core source
        id: source
        # This step and the ones below carry bash syntax; the Windows leg would
        # otherwise run them under PowerShell and fail to parse them.
        shell: bash
        run: |
          node -e "const fs=require('node:fs'); const m=JSON.parse(fs.readFileSync('plugin/release/runtime-manifest.json')); if(!/^[0-9a-f]{40}$/.test(m.sources.core.commit)) throw Error('Invalid Core commit'); fs.appendFileSync(process.env.GITHUB_OUTPUT,'commit='+m.sources.core.commit+'\n')"
          # Compare against the same file on the base branch when it is available.
          if git cat-file -e "origin/${{ github.base_ref }}:plugin/release/runtime-manifest.json" 2>/dev/null; then
            base=$(git show "origin/${{ github.base_ref }}:plugin/release/runtime-manifest.json" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const m=JSON.parse(s);process.stdout.write(m.sources.core.commit)})")
            if [ "$base" != "${{ steps.source.outputs.commit }}" ]; then
              echo "::error::the Core commit changed in this PR ($base -> ${{ steps.source.outputs.commit }}); the immutable source pin must not move in a pull request"
              exit 1
            fi
          fi
      - uses: actions/checkout@v4
        with:
          repository: LiPu-jpg/Openwrite
          ref: ${{ steps.source.outputs.commit }}
          path: core
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Restore immutable Git source bytes and compare them to the wheel
        run: python plugin/scripts/verify-core-wheel-source.py --plugin plugin --core core --restore-git-bytes --report core-wheel-source.json
      - name: Check author context reference against the pinned Core
        run: python plugin/scripts/gen-context-slots.py --plugin plugin --core core --check
      # uv/pip hit PyPI directly; a transient mirror failure should not cost a leg.
      - name: Install uv
        shell: bash
        run: |
          for attempt in 1 2 3; do
            if python -m pip install uv==0.11.19; then exit 0; fi
            sleep $((attempt * 30))
          done
          echo "::error::uv install failed after 3 attempts"
          exit 1
      # A transient resolver failure should not cost a matrix leg, but a failing
      # assertion must fail immediately: retrying the whole pytest run would
      # report a flaky test as a pass and silently overwrite the junit report.
      - name: Run all Core regressions without live-model tests
        working-directory: core
        shell: bash
        run: |
          transient='ETIMEDOUT|ECONNRESET|EAI_AGAIN|Temporary failure in name resolution|Failed to establish a new connection|ReadTimeoutError|ConnectionError|Network is unreachable'
          for attempt in 1 2 3; do
            if output=$(uv run --frozen --extra dev pytest -q --durations=15 -o faulthandler_timeout=120 --junitxml=../core-regressions.xml 2>&1); then exit 0; fi
            printf '%s\n' "$output"
            if ! printf '%s' "$output" | grep -Eq "$transient"; then
              echo "::error::core regressions failed (not a transient resolver error)"
              exit 1
            fi
            echo "::warning::transient resolver failure on attempt $attempt; retrying"
            sleep $((attempt * 30))
          done
          echo "::error::core regressions failed after 3 transient attempts"
          exit 1
      - name: Verify follow-up routes through real HTTP
        working-directory: core
        shell: bash
        run: |
          transient='ETIMEDOUT|ECONNRESET|EAI_AGAIN|Temporary failure in name resolution|Failed to establish a new connection|ReadTimeoutError|ConnectionError|Network is unreachable'
          for attempt in 1 2 3; do
            if output=$(uv run --frozen --extra dev pytest -q ../plugin/conductor/test_followup_http.py --junitxml=../followup-http.xml 2>&1); then exit 0; fi
            printf '%s\n' "$output"
            if ! printf '%s' "$output" | grep -Eq "$transient"; then
              echo "::error::follow-up HTTP verification failed (not a transient resolver error)"
              exit 1
            fi
            echo "::warning::transient resolver failure on attempt $attempt; retrying"
            sleep $((attempt * 30))
          done
          echo "::error::follow-up HTTP verification failed after 3 transient attempts"
          exit 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: core-regressions-${{ matrix.os }}
          path: |
            core-wheel-source.json
            core-regressions.xml
            followup-http.xml
          if-no-files-found: error
