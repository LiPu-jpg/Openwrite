<svg xmlns="http://www.w3.org/2000/svg" width="960" height="200" viewBox="0 0 960 200" fill="none" role="img" aria-label="OpenWrite 创作闭环架构">
  <defs>
    <linearGradient id="accentDark" x1="0" y1="0" x2="960" y2="200" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#60A5FA"/>
      <stop offset="50%" stop-color="#2DD4BF"/>
      <stop offset="100%" stop-color="#818CF8"/>
    </linearGradient>
  </defs>

  <rect x="4" y="4" width="952" height="192" rx="18" fill="#0F172A" stroke="#1E293B" stroke-width="1.5"/>
  <text x="28" y="34" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="700" fill="#94A3B8" letter-spacing="0.5">OPENWRITE 创作与验证闭环 · LOCAL WORKSPACE ENGINE</text>
  <rect x="28" y="44" width="904" height="2" rx="1" fill="url(#accentDark)" opacity="0.35"/>

  <!-- Step 1 -->
  <g>
    <rect x="24" y="62" width="164" height="114" rx="12" fill="#1E293B" stroke="#334155"/>
    <rect x="24" y="62" width="164" height="5" rx="2.5" fill="#60A5FA"/>
    <text x="38" y="88" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="700" fill="#60A5FA">01 · 资料页 / 正典</text>
    <text x="38" y="112" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="15" font-weight="700" fill="#F8FAFC">规划与设定库</text>
    <text x="38" y="135" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" fill="#CBD5E1">分卷大纲 · 人物档案</text>
    <text x="38" y="155" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" fill="#CBD5E1">世界观 · 伏笔账本</text>
  </g>
  <path d="M192 119 H206 M201 114 L207 119 L201 124" stroke="#64748B" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Step 2 -->
  <g>
    <rect x="211" y="62" width="164" height="114" rx="12" fill="#1E293B" stroke="#334155"/>
    <rect x="211" y="62" width="164" height="5" rx="2.5" fill="#38BDF8"/>
    <text x="225" y="88" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="700" fill="#38BDF8">02 · CONTEXT ENGINE</text>
    <text x="225" y="112" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="15" font-weight="700" fill="#F8FAFC">动态上下文装配</text>
    <text x="225" y="135" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" fill="#CBD5E1">硬约束保护 · 按份额配额</text>
    <text x="225" y="155" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" fill="#CBD5E1">FastEmbed 语义召回</text>
  </g>
  <path d="M379 119 H393 M388 114 L394 119 L388 124" stroke="#64748B" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Step 3 -->
  <g>
    <rect x="398" y="62" width="164" height="114" rx="12" fill="#1E293B" stroke="#334155"/>
    <rect x="398" y="62" width="164" height="5" rx="2.5" fill="#2DD4BF"/>
    <text x="412" y="88" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="700" fill="#2DD4BF">03 · 创作页 / WRITE</text>
    <text x="412" y="112" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="15" font-weight="700" fill="#F8FAFC">连续写章与编辑</text>
    <text x="412" y="135" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" fill="#CBD5E1">Vditor 沉浸编辑 · 版本锁</text>
    <text x="412" y="155" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" fill="#CBD5E1">选区批注与行内状态</text>
  </g>
  <path d="M566 119 H580 M575 114 L581 119 L575 124" stroke="#64748B" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Step 4 -->
  <g>
    <rect x="585" y="62" width="164" height="114" rx="12" fill="#1E293B" stroke="#334155"/>
    <rect x="585" y="62" width="164" height="5" rx="2.5" fill="#A78BFA"/>
    <text x="599" y="88" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="700" fill="#A78BFA">04 · REVIEW DAG</text>
    <text x="599" y="112" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="15" font-weight="700" fill="#F8FAFC">六域审稿与修订</text>
    <text x="599" y="135" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" fill="#CBD5E1">问题定位 · 选区 Diff 预览</text>
    <text x="599" y="155" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" fill="#CBD5E1">节点依赖与证据回溯</text>
  </g>
  <path d="M753 119 H767 M762 114 L768 119 L762 124" stroke="#64748B" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Step 5 -->
  <g>
    <rect x="772" y="62" width="164" height="114" rx="12" fill="#1E293B" stroke="#334155"/>
    <rect x="772" y="62" width="164" height="5" rx="2.5" fill="#FBBF24"/>
    <text x="786" y="88" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="700" fill="#FBBF24">05 · 任务页 / EXPORT</text>
    <text x="786" y="112" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="15" font-weight="700" fill="#F8FAFC">评测与成书导出</text>
    <text x="786" y="135" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" fill="#CBD5E1">多模型盲测质量与费用</text>
    <text x="786" y="155" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" fill="#CBD5E1">MD / TXT / EPUB 一键成书</text>
  </g>
