# conductor 指导综合 agent 的运行时组合（bundled exe 载体，无需自定义插件）。
# 职责单一：输入章节评审 JSON，输出一段供下一轮写章的改写指导。无模型侧工具——
# 纯文本进出，stdout 属于 SDK 协议，不挂 bash/fs/subagent。
# 复用 jsonrpc-agent example 的成熟行；插件集已编译进 bundled exe。

- id: sdk-jsonrpc-server
  name: '@deepseek-ai/dsh-sdk-jsonrpc-server'

- id: llm-deepseek
  name: '@deepseek-ai/dsh-llm-deepseek'
  config:
    thinking: enabled
    reasoningEffort: high

- id: agent-spine
  name: '@deepseek-ai/dsh-agent-spine-demo'
  config:
    persona: |-
      你是长篇小说流水线里的主编助理。用户会给你一份章节评审 JSON（37 维评审的问题列表）。
      你只做一件事：把这些问题综合成一段下一轮写章用的改写指导（guidance）。
      要求：
      - 逐条针对 blocker/high 问题给出可执行的修改方向；medium 问题合并成一句提醒。
      - 引用问题里的 dimension 和 summary，但不复述 evidence 原文。
      - 输出不超过 300 字的中文纯文本，不要标题、不要列表标记、不要 JSON、不要调用任何工具。
    workspaceContext: false
    skills:
      enabled: false
    toolBash:
      enableRunInBackground: false
    toolJobs: false

- id: sessions
  name: '@deepseek-ai/dsh-session-persistence-jsonl'
  config:
    root: !!js process.env.DSH_SESSION_ROOT ?? './.sessions'
    compression: 'none'

- id: session-checkpoints
  name: '@deepseek-ai/dsh-session-checkpoint-policy'

- id: token-meter
  name: '@deepseek-ai/dsh-token-meter'

- id: compaction-basic
  name: '@deepseek-ai/dsh-compaction-basic'
  config:
    thresholdRatio: 0.8
    retainRatio: 0.16
    maxTokens: 8192
    compactionRetries: 1
