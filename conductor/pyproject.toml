[project]
name = "dsh-openwrite-conductor"
version = "0.1.0"
description = "dsh-Openwrite 无人值守流水线：按大纲连续写章 → 六域评审 → 低于阈值回炉（OpenWrite HTTP 契约 + 可选 dsh SDK 指导综合）"
requires-python = ">=3.10"
dependencies = [
  "deepseek-harness-sdk>=0.1.1rc1",
  "beautifulsoup4>=4.12",
  "EbookLib>=0.18",
  "python-docx>=1.1",
]

[tool.uv]
# 复用仓库根的 uv 工作流；SDK 自带单文件 Node 运行时（macOS arm64 有 wheel）。
