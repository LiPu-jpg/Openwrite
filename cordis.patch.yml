# 0.2's carrier-neutral Connection does not require webServer itself, but its
# custom RPC channel registrar reads that service from its declaring context.
# OpenWrite targets Web/Desktop, where the carrier is present; declare it here
# so authenticated DoG RPC channels can register without changing transport.
- id: connection
  inject:
    - webRuntime
    - webServer

- insert:
    - id: openwrite-bundle
      name: dsh-openwrite
    - id: openwrite-bridge
      name: dsh-openwrite/bridge
      config:
        mode: managed
    - id: studio-panel
      name: ./packages/studio-panel/lib/index.js
    - id: openwrite-dog
      name: ./vendor/dsh-dog/lib/index.js
