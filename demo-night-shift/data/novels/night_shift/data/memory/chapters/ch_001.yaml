chapter_id: ch_001
title: 第一章 多出来的客人
summary: 凌晨两点四十，便利店店员小周发现3号冰柜结霜异常，打开后看见一名深色外套、皮肤青灰的蜷缩人影。他拍照并报警，再次确认时人影消失，只剩压扁的冰淇淋、水渍和通向后的拖痕。后门电闸被胶带固定，店长老陈此时来交接，并提醒他别乱翻监控。监控回放中，2:41出现人影后又跳帧消失。小周将照片存入加密相册，并想起半年前街头目睹男人拽女人、自己低头离开的往事。
word_count: 1111
observations: '- 凌晨2:38，小周发现便利店3号冰柜结霜异常并记录在备忘录

  - 小周在3号冰柜内看见一名深色外套、皮肤青灰、嘴唇无血色的蜷缩人影

  - 小周拍下三张照片并拨打110，接线员要求其再次确认

  - 小周再次打开冰柜时人影消失，只剩压扁的冰淇淋和正在结冰的水渍

  - 冰柜底部有从柜内延伸到后门方向的浅浅拖痕

  - 后门电闸被胶带缠三圈固定在“开”的位置，小周未能扯动

  - 店长老陈在此时出现，称来交接，并注意到后门胶带

  - 老陈说“监控别乱翻，那玩意儿费电”

  - 监控回放显示2:39冰柜前空无一物，2:41出现深色外套人影，画面跳后人影消失

  - 小周将手机照片存入加密相册

  - 小周回忆半年前街头目睹男人拽女人胳膊、女人喊叫，自己看了几秒后离开

  - 小周后来换手机号并搬家'
